apiVersion: apps/v1
kind: Deployment
metadata:
  name: nodejs-app-deployment
spec:
  replicas: 2
  selector:
    matchLabels:
      app: nodejs-app
  template:
    metadata:
      labels:
        app: nodejs-app
    spec:
      containers:
        - name: nodejs-app
          image: docker.io/library/my-nodejs-app:latest   # Replace with real image e.g. mahoro123/jenkins:latest
          imagePullPolicy: Never
          ports:
            - containerPort: 3000
